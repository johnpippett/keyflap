# Copy to .github/workflows/ios-testflight.yml (needs a token with the `workflow` scope).
# Manual only. Archives a Release build, signs it through the App Store Connect API key
# (automatic signing, -allowProvisioningUpdates) and uploads it to TestFlight. Does
# nothing until these exist (docs/integrations/ios-app.md, "TestFlight"):
#   secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 text), APPLE_TEAM_ID
#   variable IOS_BUNDLE_ID (optional; default com.example.KeyflapApprover)
# and an app record with that bundle id in App Store Connect.
name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.example.KeyflapApprover' }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check configuration
        id: gate
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$TEAM_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight secrets are not set; nothing to do (see docs/integrations/ios-app.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.ok == 'true'
        name: Xcode, XcodeGen, API key
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)"
          xcodebuild -version
          brew install xcodegen
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      - if: steps.gate.outputs.ok == 'true'
        name: Archive (Release, production APNs)
        working-directory: ios/xcode
        run: |
          # TestFlight / App Store builds receive production pushes.
          plutil -replace aps-environment -string production ../KeyflapApprover.entitlements
          xcodegen generate
          xcodebuild archive -quiet \
            -project KeyflapApprover.xcodeproj \
            -scheme KeyflapApprover \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Keyflap.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - if: steps.gate.outputs.ok == 'true'
        name: Upload to TestFlight
        working-directory: ios/xcode
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Keyflap.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - if: always()
        name: Remove the API key
        run: rm -rf "$RUNNER_TEMP/asc"
