# XcodeGen spec for CI and TestFlight (cd ios/xcode && xcodegen generate). The same
# shape xtool builds: an app target that links the KeyflapApprover package library (which
# holds all the code and @main) and carries the asset catalog, Info.plist and
# entitlements. Like xtool's own generated project it lives below the package root and
# points at it with "..". Local development on Linux uses xtool with ../xtool.yml.
name: KeyflapApprover
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  KeyflapApprover:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  KeyflapApprover:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: ../AppHost
        excludes:
          - "AppIcon.svg"
    dependencies:
      - package: KeyflapApprover
        product: KeyflapApprover
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Keyflap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Keyflap uses the camera only to scan your broker's pairing QR code.
        NSFaceIDUsageDescription: "Face ID approves sign-ins: your approval key in the Secure Enclave only signs after Face ID."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.KeyflapApprover
        PRODUCT_NAME: KeyflapApprover
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ../KeyflapApprover.entitlements
        CODE_SIGN_STYLE: Automatic
        # The app target has no Swift of its own (empty.c, as in xtool's generated project);
        # make sure the Swift runtime and the package's @main link in.
        ENABLE_DEBUG_DYLIB: NO
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SDKROOT)/usr/lib/swift"
          - "$(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "/usr/lib/swift"
          - "@executable_path/Frameworks"
