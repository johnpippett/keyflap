# Keyflap broker service users (docs/ISOLATION_PLAN.md D2). No login shell, no home outside
# their state directories.
u keyflap-core - "Keyflap broker core" /var/lib/keyflap/core /usr/sbin/nologin
u keyflap-signer - "Keyflap broker signer" /var/lib/keyflap/signer /usr/sbin/nologin
u keyflap-web - "Keyflap broker approver page" / /usr/sbin/nologin
