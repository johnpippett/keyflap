# Keyflap broker runtime directories (installed by packages/install/linux/install.sh).
# /run/keyflap: the intent and admin sockets (each socket has its own owner and mode).
d /run/keyflap 0755 root root -
# /run/keyflap-signer: only root and keyflap-core may even reach the signer sockets.
d /run/keyflap-signer 0750 root keyflap-core -
# /run/keyflap-approver: only root and keyflap-web (the approver front) reach the core's API socket.
d /run/keyflap-approver 0750 root keyflap-web -
