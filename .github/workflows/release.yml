name: Release

# Builds the service-mode release tarballs for a version tag (Linux x64 and arm64, macOS
# Apple silicon: the bundle is OS-independent, the darwin tarball adds the darwin Node and
# keyflap-launch cross-compiled in a pinned container, so one Linux job builds all three),
# attests them (Sigstore, keyless, through GitHub artifact attestations) and opens a *draft*
# GitHub Release for the owner to review and publish. Tags only, never on push or PR.
# Verify a download: docs/integrations/service-mode.md, "Install from a release".
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # the draft release
      id-token: write # OIDC token for the Sigstore signing certificate
      attestations: write # store the provenance attestation
    env:
      NODE_OPTIONS: --disable-warning=ExperimentalWarning
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
            { echo "::error::tag $TAG is not vX.Y.Z[-pre]"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency caches in the release job: a cache entry written by another workflow
      # run must not be able to change what gets built and signed.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright (e2e tests)
        run: pnpm --filter @aab/shim exec playwright install --with-deps chromium
      - run: pnpm check

      - name: Build the release tarballs
        run: |
          # The tarball must be exactly the tagged commit (the tests leave nothing tracked).
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short; echo "::error::the tree changed during the checks"; exit 1
          fi
          packages/install/linux/build-bundle.sh --release dist --version "${TAG#v}" --os all --arch all
          # The one-command installer asset (install-keyflap.sh).
          if [[ -x packages/install/bootstrap/make-bootstrap.sh ]]; then
            packages/install/bootstrap/make-bootstrap.sh dist "${TAG#v}"
          fi
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Keyflap ${TAG#v}" \
            --notes "Service-mode install for Linux (x64, arm64) and macOS (Apple silicon). Verify before installing: docs/integrations/service-mode.md, \"Install from a release\"." \
            dist/*
